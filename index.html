    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        html { background-color: #0A0A0A; }

        body {
            font-family: 'Quicksand', sans-serif;
            color: #EDEDED;
            background-color: transparent;
            letter-spacing: 0.05em;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            margin: 0 auto;
            max-width: 28rem;
            background-image: url('fotos-menu/pizzas-clasicas.webp');
            background-size: cover;
            background-position: center;
            opacity: 0.08;
            z-index: -1;
            pointer-events: none;
        }

        .font-title { font-family: 'Quicksand', sans-serif; letter-spacing: 0.15em; }

        .text-neon-red {
            color: #FFFFFF;
            text-shadow: 0 0 8px #CC0000, 0 0 16px #CC0000;
        }

        .border-neon-red {
            border-color: #CC0000;
            box-shadow: 0 0 10px rgba(204,0,0,0.45), inset 0 0 5px rgba(204,0,0,0.15);
        }

        .bg-card { background-color: #1A1A1A; }

        .fade-in { animation: fadeIn 0.3s ease-out forwards; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .no-scroll::-webkit-scrollbar { display: none; }

        /* Crown badge */
        .crown-badge {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
            filter: drop-shadow(0 0 6px #FFD700);
        }

        /* Size pills */
        .size-pill {
            display: inline-block;
            padding: 4px 12px;
            border: 1px solid #555;
            border-radius: 20px;
            font-size: 11px;
            letter-spacing: 0.08em;
            color: #aaa;
            font-family: 'Quicksand', sans-serif;
        }

        .size-pill span {
            color: #CC0000;
            font-weight: 700;
            text-shadow: 0 0 6px #CC0000;
        }
    </style>
</head>

        // ── RENDER ──────────────────────────────────────────────────────
        function renderCategorias() {
            const container = document.getElementById('contenedor-categorias-principal');
            container.innerHTML = categorias.map(cat => `
                <div onclick="filtrar('${cat.id}')" class="relative h-36 rounded overflow-hidden shadow-lg border border-[#333] active:scale-95 transition-transform cursor-pointer group"
                    style="border-color:#2a2a2a">
                    <img src="${cat.foto}" loading="lazy" class="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:opacity-80 transition-opacity bg-[#1A1A1A]" alt="${cat.id}">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent flex items-end justify-center pb-4">
                        <span class="text-white text-xl font-title tracking-[0.2em] uppercase drop-shadow-md text-center px-2 leading-tight">${cat.id}</span>
                    </div>
                    <div class="absolute inset-0 border-2 border-transparent group-hover:border-[#CC0000] rounded transition-all duration-300"
                        style="box-shadow:inset 0 0 0 0 #CC0000"></div>
                </div>
            `).join('');
        }

        function filtrar(cat) {
            const filtrados = platos.filter(p => p.categoria === cat);

            document.getElementById('vista-categorias').classList.add('hidden');
            document.getElementById('vista-platos').classList.remove('hidden');
            document.getElementById('btn-atras').classList.remove('hidden');
            document.getElementById('header-title').classList.add('hidden');
            document.getElementById('titulo-actual').innerHTML = `
                <span class="w-10 h-[2px] bg-[#CC0000] shadow-[0_0_8px_#CC0000] mr-3 flex-shrink-0"></span>${cat}`;

            const grid = document.getElementById('grid-platos');
            grid.innerHTML = '';

            if (filtrados.length === 0) {
                grid.innerHTML = '<p class="col-span-2 text-center text-gray-500 py-10 font-title text-sm uppercase">Próximamente</p>';
            } else {
                filtrados.forEach(plato => {
                    grid.innerHTML += `
                        <div onclick="openDetail(${plato.id})" class="bg-[#111] rounded shadow-lg overflow-hidden active:scale-95 transition-transform duration-200 text-center border-b-2 border-[#CC0000] flex flex-col h-full" style="box-shadow:0 4px 10px rgba(204,0,0,0.1)">
                            <img src="${plato.foto}" loading="lazy" class="w-full h-40 object-cover opacity-85 flex-shrink-0 bg-[#1A1A1A]">
                            <div class="p-3 flex flex-col justify-between flex-grow">
                                <h4 class="font-title text-xs tracking-wide leading-tight text-gray-200 uppercase">${plato.nombre}</h4>
                                <p class="font-title font-bold text-sm mt-2 whitespace-nowrap" style="color:#FF3333;text-shadow:0 0 6px #CC0000">${plato.precio}</p>
                            </div>
                        </div>`;
                });
            }
            history.pushState({ view: 'platos' }, "");
            window.scrollTo(0, 0);
        }

        function openDetail(id) {
            const p = platos.find(x => x.id === id);
            document.getElementById('detail-img').src = p.foto;
            document.getElementById('detail-title').innerText = p.nombre;
            document.getElementById('detail-price').innerText = p.precio;
            document.getElementById('detail-ingredients').innerText = p.ingredientes;

            // Sizes
            const sizesWrap = document.getElementById('detail-sizes-wrap');
            const sizesDiv  = document.getElementById('detail-sizes');
            if (p.tallas && p.tallas.length) {
                sizesDiv.innerHTML = p.tallas.map(t =>
                    `<span class="size-pill">${t.l} <span>${t.p}</span></span>`
                ).join('');
                sizesWrap.classList.remove('hidden');
            } else {
                sizesWrap.classList.add('hidden');
            }

            // Allergens
            const divA = document.getElementById('detail-alergenos');
            divA.innerHTML = p.alergenos && p.alergenos.length
                ? p.alergenos.map(a => `
                    <div class="w-10 h-10 rounded border border-[#CC0000] flex items-center justify-center bg-[#050505] text-lg"
                        style="box-shadow:0 0 8px rgba(204,0,0,0.2)">${a}</div>`).join('')
                : '<span class="text-xs text-gray-600 font-light">Sin alérgenos declarados*</span>';

            document.getElementById('dish-detail').classList.remove('translate-y-full');
            document.body.style.overflow = 'hidden';
            history.pushState({ view: 'detalle' }, "");
        }

        function closeDetail() {
            document.getElementById('dish-detail').classList.add('translate-y-full');
            document.body.style.overflow = 'auto';
        }

        window.onload = renderCategorias;

        window.onpopstate = function(event) {
            const detailOpen  = !document.getElementById('dish-detail').classList.contains('translate-y-full');
            const platosOpen  = !document.getElementById('vista-platos').classList.contains('hidden');

            if (detailOpen) {
                closeDetail();
            } else if (platosOpen) {
                document.getElementById('vista-categorias').classList.remove('hidden');
                document.getElementById('vista-platos').classList.add('hidden');
                document.getElementById('btn-atras').classList.add('hidden');
                document.getElementById('header-title').classList.remove('hidden');
            }
        };
    </script>
